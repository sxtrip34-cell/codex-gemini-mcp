<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  #frame { width: 128px; height: 128px; border-radius: 30px; display: grid; place-items: center; background: radial-gradient(120% 120% at 20% 10%, #24316a 0%, var(--ink) 55%), var(--ink); }
  .mark { position: relative; width: 84px; height: 84px; }
  .mark .s { position: absolute; left: 0; top: 0; }
  .mark .r { position: absolute; right: 0; bottom: 0; }
</style>
</head>
<body>
<div id="frame">
  <div class="glow" style="width:90px;height:90px;left:-10px;top:-10px;background:#5b6df0;opacity:.45;filter:blur(30px)"></div>
  <div class="glow" style="width:90px;height:90px;right:-20px;bottom:-20px;background:#1aa585;opacity:.4;filter:blur(30px)"></div>
  <div class="mark"><span class="s" data-mark="gemini" data-size="60"></span><span class="r" data-mark="codex" data-size="44"></span></div>
</div>
<script src="marks.js"></script>
</body>
</html>
