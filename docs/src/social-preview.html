<!doctype html>
<html>
<!-- 1280x640 image for GitHub's social preview (Settings → General → Social preview). -->
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  #frame { width: 1280px; height: 640px; border-radius: 0; display: grid; place-items: center; }
  iframe { width: 1280px; height: 440px; border: 0; }
  .foot { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; color: var(--faint); font-size: 18px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div id="frame">
  <div class="glow" style="width:640px;height:420px;left:-200px;top:-260px;background:#3b5bd6;opacity:.45"></div>
  <div class="glow" style="width:640px;height:420px;right:-220px;bottom:-280px;background:#1aa585;opacity:.4"></div>
  <iframe src="banner.html"></iframe>
  <div class="foot">github.com · codex-gemini-mcp · MIT</div>
</div>
</body>
</html>
