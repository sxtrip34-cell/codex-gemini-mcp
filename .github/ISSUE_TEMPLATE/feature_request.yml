name: Feature request
description: An idea for a tool, an option or the panel.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [codex-mcp, gemini-mcp, panel, installer, docs, not sure]
